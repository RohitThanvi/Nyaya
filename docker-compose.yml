# NyayaAI — Production docker-compose
# Hardware: 4× RTX 6000 Ada (48GB each), 512GB RAM, 27.1TB NVMe

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB:       ${DB_NAME:-nyaya_ai}
      POSTGRES_USER:     ${DB_USER:-nyaya_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nyaya_pass}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/00_extensions.sql
      - ./backend/db/migrations/0001_initial.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./infra/docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    shm_size: '256mb'           # needed for parallel query workers
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nyaya_user} -d ${DB_NAME:-nyaya_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Qdrant ──────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.7.4
    volumes:
      - qdrant_data:/qdrant/storage
      - ./infra/docker/qdrant/config.yaml:/qdrant/config/config.yaml
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__LOG_LEVEL: "INFO"
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "false"    # keep payloads in 512GB RAM
    # Give Qdrant access to as much RAM as it needs — 300GB budget for vectors+payloads
    mem_limit: 300g
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/6333' && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./infra/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    mem_limit: 34g
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DB_HOST:            postgres
      QDRANT_HOST:        qdrant
      REDIS_HOST:         redis
      PYTHONPATH:         /app
      EMBEDDING_DEVICE:   cpu
      EMBEDDING_BATCH_SIZE: 32
      EMBEDDING_FP16:     "false"
    volumes:
      - ./data:/app/data
      - model_cache:/app/data/embeddings/models
    ports:
      - "8000:8000"
    # Backend uses GPU for real-time query embedding when available.
    # GPU reservation is in docker-compose.gpu.yml — not here, so the
    # stack starts cleanly in WSL2 / CPU-only environments.
    depends_on:
      postgres: { condition: service_healthy }
      qdrant:   { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  # ── Frontend (Next.js) ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on: [backend]
    restart: unless-stopped

  # ── Nginx ────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on: [backend, frontend]
    restart: unless-stopped

  # ── Celery: CPU parse workers (32 concurrent) ────────────────────────────────
  celery-parser:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DB_HOST:     postgres
      QDRANT_HOST: qdrant
      REDIS_HOST:  redis
      PYTHONPATH:  /app
    command: >
      celery -A backend.ingestion.workers.celery_app worker
      -Q nyaya_parse -c 32 --loglevel=info -n parser@%h
      --max-tasks-per-child=1000
    volumes:
      - ./data:/app/data
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  # ── Celery: GPU embed workers — one per GPU ───────────────────────────────────
  celery-embed-gpu0:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DB_HOST:              postgres
      QDRANT_HOST:          qdrant
      REDIS_HOST:           redis
      PYTHONPATH:           /app
      CUDA_VISIBLE_DEVICES: "0"
      EMBEDDING_DEVICE:     cpu
      EMBEDDING_BATCH_SIZE: "32"
      EMBEDDING_FP16:       "false"
    command: >
      celery -A backend.ingestion.workers.celery_app worker
      -Q nyaya_embed_gpu_0 -c 1 --loglevel=info -n embed_gpu0@%h
      --max-tasks-per-child=500
    volumes:
      - ./data:/app/data
      - model_cache:/app/data/embeddings/models
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  celery-embed-gpu1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DB_HOST:              postgres
      QDRANT_HOST:          qdrant
      REDIS_HOST:           redis
      PYTHONPATH:           /app
      CUDA_VISIBLE_DEVICES: "1"
      EMBEDDING_DEVICE:     cpu
      EMBEDDING_BATCH_SIZE: "32"
      EMBEDDING_FP16:       "false"
    command: >
      celery -A backend.ingestion.workers.celery_app worker
      -Q nyaya_embed_gpu_1 -c 1 --loglevel=info -n embed_gpu1@%h
      --max-tasks-per-child=500
    volumes:
      - ./data:/app/data
      - model_cache:/app/data/embeddings/models
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  celery-embed-gpu2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DB_HOST:              postgres
      QDRANT_HOST:          qdrant
      REDIS_HOST:           redis
      PYTHONPATH:           /app
      CUDA_VISIBLE_DEVICES: "2"
      EMBEDDING_DEVICE:     cpu
      EMBEDDING_BATCH_SIZE: "32"
      EMBEDDING_FP16:       "false"
    command: >
      celery -A backend.ingestion.workers.celery_app worker
      -Q nyaya_embed_gpu_2 -c 1 --loglevel=info -n embed_gpu2@%h
      --max-tasks-per-child=500
    volumes:
      - ./data:/app/data
      - model_cache:/app/data/embeddings/models
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  celery-embed-gpu3:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DB_HOST:              postgres
      QDRANT_HOST:          qdrant
      REDIS_HOST:           redis
      PYTHONPATH:           /app
      CUDA_VISIBLE_DEVICES: "3"
      EMBEDDING_DEVICE:     cpu
      EMBEDDING_BATCH_SIZE: "32"
      EMBEDDING_FP16:       "false"
    command: >
      celery -A backend.ingestion.workers.celery_app worker
      -Q nyaya_embed_gpu_3 -c 1 --loglevel=info -n embed_gpu3@%h
      --max-tasks-per-child=500
    volumes:
      - ./data:/app/data
      - model_cache:/app/data/embeddings/models
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  # ── Celery: Qdrant flush worker ───────────────────────────────────────────────
  celery-flush:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DB_HOST:     postgres
      QDRANT_HOST: qdrant
      REDIS_HOST:  redis
      PYTHONPATH:  /app
    command: >
      celery -A backend.ingestion.workers.celery_app worker
      -Q nyaya_flush -c 1 --loglevel=info -n flusher@%h
    volumes:
      - ./data:/app/data
    depends_on:
      postgres: { condition: service_healthy }
      qdrant:   { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  # ── Celery Beat (scheduled flush every 30s) ───────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DB_HOST:    postgres
      REDIS_HOST: redis
      PYTHONPATH: /app
    command: >
      celery -A backend.ingestion.workers.celery_app beat
      --loglevel=info
    depends_on: [redis]
    restart: unless-stopped

  # ── Dead-letter worker (inspect failed tasks) ─────────────────────────────────
  celery-dlq:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DB_HOST:    postgres
      REDIS_HOST: redis
      PYTHONPATH: /app
    command: >
      celery -A backend.ingestion.workers.celery_app worker
      -Q nyaya_dlq -c 1 --loglevel=warning -n dlq@%h
    depends_on: [redis]
    restart: unless-stopped

  # ── Flower — Celery task monitoring UI ─────────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      PYTHONPATH: /app
    command: >
      celery -A backend.ingestion.workers.celery_app flower
      --port=5555
    ports:
      - "5555:5555"
    depends_on: [redis]
    restart: unless-stopped


volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  model_cache:
