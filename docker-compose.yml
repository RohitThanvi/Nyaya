services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-nyaya_ai}
      POSTGRES_USER: ${DB_USER:-nyaya_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nyaya_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/00_extensions.sql
      - ./backend/db/migrations/0001_initial.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nyaya_user} -d ${DB_NAME:-nyaya_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Qdrant ──────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.7.4
    volumes:
      - qdrant_data:/qdrant/storage
      # config mounted directly to the path Qdrant v1.7.x reads at startup
      - ./infra/docker/qdrant/config.yaml:/qdrant/config/config.yaml
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__LOG_LEVEL: "INFO"
    healthcheck:
      # Pure TCP check — Qdrant image has no curl/wget
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/6333' && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./infra/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONPATH: /app
    volumes:
      - ./data:/app/data
      - model_cache:/app/data/embeddings/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (Next.js) ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # ── Optional services — uncomment to enable ──────────────────────────────────
  #
  # Celery parse worker (CPU — bulk PDF ingestion)
  # celery-parser:
  #   build:
  #     context: .
  #     dockerfile: backend/Dockerfile
  #   env_file: .env
  #   environment:
  #     DB_HOST: postgres
  #     QDRANT_HOST: qdrant
  #     REDIS_HOST: redis
  #     PYTHONPATH: /app
  #   command: >
  #     celery -A backend.ingestion.workers.celery_app worker
  #     -Q nyaya_parse -c 8 --loglevel=info -n parser@%h
  #   volumes:
  #     - ./data:/app/data
  #   depends_on:
  #     - postgres
  #     - redis
  #
  # Celery embed worker (GPU recommended)
  # celery-embedder:
  #   build:
  #     context: .
  #     dockerfile: backend/Dockerfile
  #   env_file: .env
  #   environment:
  #     DB_HOST: postgres
  #     QDRANT_HOST: qdrant
  #     REDIS_HOST: redis
  #     PYTHONPATH: /app
  #     EMBEDDING_DEVICE: cpu
  #   command: >
  #     celery -A backend.ingestion.workers.celery_app worker
  #     -Q nyaya_embed -c 2 --loglevel=info -n embedder@%h
  #   volumes:
  #     - ./data:/app/data
  #     - model_cache:/app/data/embeddings/models
