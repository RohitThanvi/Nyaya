worker_processes auto;
events { worker_connections 1024; }

http {
    upstream backend { server backend:8000; }
    upstream frontend { server frontend:3000; }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    # Rate limiting — keyed by IP, excludes OPTIONS (see map below)
    limit_req_zone $limit_key zone=api:10m rate=60r/m;
    map $request_method $limit_key {
        OPTIONS "";
        default $binary_remote_addr;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 0;  # unlimited at proxy layer — true limits enforced
                                  # in FastAPI (single-shot) and chunked upload session
                                  # (INGEST_MAX_FILE_SIZE_GB), not here

        # API routes
        location /api/ {
            # OPTIONS preflight bypasses rate limiting and the backend entirely —
            # answered directly by Nginx with zero risk of FastAPI/SlowAPI/middleware
            # interference. This is the actual fix for the "400 on OPTIONS" bug:
            # the CORS preflight was being consumed by limit_req's burst bucket
            # alongside real traffic, and rejected requests with no error_page
            # configured surface as a raw 400 to the browser.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Content-Range" always;
                add_header Access-Control-Max-Age 600 always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # CORS headers added here too, since proxy_pass responses from
            # FastAPI already include them, but this guarantees consistency
            # even if a backend error response (500, etc.) skips middleware.
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
