# Redis config — tuned for 512GB RAM machine
# Semantic cache + embedding cache + Celery broker + session store

# Use 32GB for Redis — generous enough to cache millions of query embeddings
# and thousands of full LegalResponse objects without evicting aggressively.
maxmemory 32gb
maxmemory-policy allkeys-lru

# Persistence: RDB snapshots + AOF for durability
# On a 512GB/27TB machine, disk writes are cheap — keep both.
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Network
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Performance
activerehashing yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Increase max clients for high-concurrency ingestion + query load
maxclients 10000

# Disable slow-log for very short operations (only log > 10ms)
slowlog-log-slower-than 10000
