[databases]
nyaya_ai = host=postgres port=5432 dbname=nyaya_ai

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Transaction pooling: connections returned to pool after each transaction.
# Most compatible with async SQLAlchemy and Celery workers.
# Each of 300 app-side connections shares a pool of 50 real PG connections.
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 3

# Connection limits
server_idle_timeout = 600
client_idle_timeout = 0
server_lifetime = 3600

# Health
server_check_query = select 1
server_check_delay = 30

# Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

ignore_startup_parameters = extra_float_digits,options
