# Qdrant v1.7.4 server config
# Note: on_disk_payload, quantization, HNSW params are collection-level settings
# configured at collection creation time (see VectorRetriever.ensure_collection).
# This file only contains valid SERVER-level configuration for v1.7.4.

storage:
  storage_path: /qdrant/storage

service:
  max_request_size_mb: 512
  max_workers: 0
  grpc_port: 6334
  enable_tls: false

log_level: INFO
