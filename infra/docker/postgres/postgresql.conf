# PostgreSQL tuning for 512GB RAM / 27TB NVMe storage
# Apply by mounting this file and setting:
#   command: postgres -c config_file=/etc/postgresql/postgresql.conf

# Memory — the single biggest lever for PG performance at scale
shared_buffers = 128GB          # 25% of RAM: PG's own buffer pool
effective_cache_size = 384GB    # hint to planner: OS + PG caches combined
work_mem = 2GB                  # per sort/hash operation — 64 parallel workers × 2GB = 128GB peak
maintenance_work_mem = 16GB     # VACUUM, CREATE INDEX, ALTER TABLE

# Parallel query workers
max_parallel_workers = 32
max_parallel_workers_per_gather = 16
max_parallel_maintenance_workers = 8
max_worker_processes = 64

# WAL — large values reduce checkpoint frequency during bulk ingestion
wal_buffers = 256MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
max_wal_size = 16GB
min_wal_size = 2GB

# Storage — NVMe SSDs can handle high random I/O, lower these from spinning-disk defaults
random_page_cost = 1.1          # NVMe: near-sequential random access
seq_page_cost = 1.0
effective_io_concurrency = 200  # NVMe: high parallel I/O

# Connection pool
max_connections = 300           # pool_size=64 × workers=4 + headroom

# Statistics and autovacuum — critical for partition maintenance at scale
autovacuum_max_workers = 8
autovacuum_vacuum_cost_limit = 2000
autovacuum_naptime = 10s
default_statistics_target = 500  # better query plans on large partitioned tables

# Logging — only log slow queries (> 500ms) in production
log_min_duration_statement = 500
log_checkpoints = on
log_autovacuum_min_duration = 1000
