# Dev-safe Postgres config — for local Docker Desktop / WSL2.
#
# infra/docker/postgres/postgresql.conf is tuned for the production box
# (512GB RAM) and sets shared_buffers=128GB, effective_cache_size=384GB,
# work_mem=2GB, maintenance_work_mem=16GB, etc. A local dev machine's
# Docker/WSL2 VM almost never has anywhere near that much RAM, so Postgres
# either fails to allocate shared_buffers at startup or gets OOM-killed
# under load — which is what was surfacing as PgBouncer "connect failed" /
# "client_login_timeout (server down)" errors: Postgres was crash-looping,
# not misconfigured on the networking side.
#
# This file is mounted instead via docker-compose.override.yml, which
# docker compose loads automatically for local runs. Production deploys
# use `-f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.prod.yml`
# explicitly and never pick up the override file, so this only affects
# local/dev.

shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 128MB
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2
max_worker_processes = 8
wal_buffers = 16MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
max_wal_size = 1GB
min_wal_size = 256MB
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 100
max_connections = 100
autovacuum_max_workers = 3
autovacuum_vacuum_cost_limit = 2000
autovacuum_naptime = 10s
default_statistics_target = 100
log_min_duration_statement = 500
log_checkpoints = on
log_autovacuum_min_duration = 1000
