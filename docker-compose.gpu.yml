# GPU override — use when NVIDIA container toolkit is properly configured.
#
# Prerequisites:
#   Windows host: Install NVIDIA Game Ready / Studio driver >= 525.x
#   WSL2: Run these once inside WSL2:
#     curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
#     curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \
#       sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | \
#       sudo tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
#     sudo apt-get update && sudo apt-get install -y nvidia-container-toolkit
#     sudo nvidia-ctk runtime configure --runtime=docker
#     sudo service docker restart
#   Verify: docker run --rm --gpus all nvidia/cuda:12.1.0-base-ubuntu22.04 nvidia-smi
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# This override adds:
#   - GPU device reservations to backend + all 4 Celery embed workers
#   - EMBEDDING_DEVICE=cuda, EMBEDDING_BATCH_SIZE=512, FP16=true
#   - CUDA_VISIBLE_DEVICES pinning per worker

services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BASE: nvidia/cuda:12.1.0-cudnn8-runtime-ubuntu22.04
    environment:
      EMBEDDING_DEVICE:    cuda
      EMBEDDING_BATCH_SIZE: "512"
      EMBEDDING_FP16:      "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  celery-embed-gpu0:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BASE: nvidia/cuda:12.1.0-cudnn8-runtime-ubuntu22.04
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      EMBEDDING_DEVICE:     cuda
      EMBEDDING_BATCH_SIZE: "512"
      EMBEDDING_FP16:       "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  celery-embed-gpu1:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BASE: nvidia/cuda:12.1.0-cudnn8-runtime-ubuntu22.04
    environment:
      CUDA_VISIBLE_DEVICES: "1"
      EMBEDDING_DEVICE:     cuda
      EMBEDDING_BATCH_SIZE: "512"
      EMBEDDING_FP16:       "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

  celery-embed-gpu2:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BASE: nvidia/cuda:12.1.0-cudnn8-runtime-ubuntu22.04
    environment:
      CUDA_VISIBLE_DEVICES: "2"
      EMBEDDING_DEVICE:     cuda
      EMBEDDING_BATCH_SIZE: "512"
      EMBEDDING_FP16:       "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]

  celery-embed-gpu3:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BASE: nvidia/cuda:12.1.0-cudnn8-runtime-ubuntu22.04
    environment:
      CUDA_VISIBLE_DEVICES: "3"
      EMBEDDING_DEVICE:     cuda
      EMBEDDING_BATCH_SIZE: "512"
      EMBEDDING_FP16:       "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]
